        <li><a href="{{ '/courses/' | relative_url }}" class="nav-link {% if page.url contains '/courses/' or page.layout == 'course' %}active{% endif %}"><i class="fas fa-graduation-cap"></i> Courses</a></li>
        <li><a href="{{ '/tools/' | relative_url }}" class="nav-link {% if page.url contains '/tools/' %}active{% endif %}"><i class="fas fa-tools"></i> Tools</a></li>

          <span></span>

<script>
  // Robust normalized client-side route highlighter
  (function() {
    function highlightActiveNav() {
      let currentPath = window.location.pathname.replace(/\/$/, '') || '/';
      const navLinks = document.querySelectorAll('.nav-menu a.nav-link');

      navLinks.forEach(link => {
        let linkPath = link.pathname.replace(/\/$/, '') || '/';
        link.classList.remove('active');

        if (linkPath === currentPath) {
          link.classList.add('active');
        } else if (linkPath !== '/' && currentPath.startsWith(linkPath)) {
          link.classList.add('active');
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', highlightActiveNav);
    } else {
      highlightActiveNav();
    }
  })();
</script>
